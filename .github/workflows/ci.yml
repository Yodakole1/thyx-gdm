name: ci

on:
  push:
    branches: [main, gdm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x \
            scripts/build \
            scripts/install \
            scripts/uninstall \
            scripts/preview \
            scripts/lib/*.sh

  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: compile
        run: python3 -m py_compile scripts/lib/_preview.py

  extension:
    name: greeter extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The greeter extension is loaded by GNOME Shell, which is not here to
      # complain, so the two things that can be checked without it are: the
      # metadata GNOME Shell validates on load, and that the module parses.
      - name: metadata
        run: |
          python3 - <<'PY'
          import json, os, sys

          root = 'extensions'
          uuids = os.listdir(root)
          if not uuids:
              sys.exit('no extension found under extensions/')

          for uuid in uuids:
              with open(os.path.join(root, uuid, 'metadata.json')) as f:
                  meta = json.load(f)

              # GNOME Shell refuses to load an extension whose metadata is
              # missing any of these, or whose uuid disagrees with its folder.
              for key in ('uuid', 'name', 'description', 'shell-version'):
                  if not meta.get(key):
                      sys.exit(f'{uuid}: missing "{key}"')

              if meta['uuid'] != uuid:
                  sys.exit(f'{uuid}: uuid is "{meta["uuid"]}"')

              if not isinstance(meta['shell-version'], list) or \
                 not all(isinstance(v, str) for v in meta['shell-version']):
                  sys.exit(f'{uuid}: shell-version must be a list of strings')

              # Without this it loads in a logged-in session too.
              if meta.get('session-modes') != ['gdm']:
                  sys.exit(f'{uuid}: session-modes must be exactly ["gdm"]')

              print(f'{uuid}: ok')
          PY

      - name: the module must parse
        run: |
          set -euo pipefail
          for js in extensions/*/extension.js; do
            cp "${js}" "/tmp/$(basename "$(dirname "${js}")").mjs"
          done
          for mjs in /tmp/*.mjs; do
            echo "==> ${mjs}"
            node --check "${mjs}"
          done

  build:
    name: build every preset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # gnome-shell-common carries the stock gdm-theme.gresource the build
      # derives from; without it there is nothing to append to. gresource
      # lives in libglib2.0-bin but glib-compile-resources is in the -dev-bin
      # package, and the build needs both.
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-bin libglib2.0-dev-bin ffmpeg gnome-shell-common

      - name: build theme.conf
        run: ./scripts/build

      - name: build every preset
        run: |
          set -euo pipefail
          for preset in presets/*.conf; do
            echo "==> ${preset}"
            ./scripts/build --config "${preset}" --quiet
          done

      - name: the built bundle must be loadable and carry our block
        run: |
          set -euo pipefail
          gresource list build/gnome-shell-theme.gresource > /tmp/listing
          grep -qx /org/gnome/shell/theme/gdm.css /tmp/listing
          grep -qx /org/gnome/shell/theme/thyx-background.jpg /tmp/listing
          gresource extract build/gnome-shell-theme.gresource \
            /org/gnome/shell/theme/gdm.css > /tmp/gdm.css
          grep -qF 'thyx:begin' /tmp/gdm.css
          grep -qF 'thyx:end' /tmp/gdm.css
          # no template token may survive into the shipped stylesheet
          ! grep -qE '@[A-Za-z0-9_]+@' /tmp/gdm.css

      - name: a rebuild must not stack the override block
        run: |
          set -euo pipefail
          ./scripts/build --quiet
          gresource extract build/gnome-shell-theme.gresource \
            /org/gnome/shell/theme/gdm.css > /tmp/again.css
          test "$(grep -cF 'thyx:begin' /tmp/again.css)" -eq 1

      - name: a bad colour must fail the build
        run: |
          set -euo pipefail
          sed 's/^LoginButtonBackgroundColor=.*/LoginButtonBackgroundColor="orange"/' \
            theme.conf > /tmp/bad.conf
          if ./scripts/build --config /tmp/bad.conf --quiet; then
            echo "expected the build to reject a non-hex colour"
            exit 1
          fi
