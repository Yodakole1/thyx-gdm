[General]

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
# Font must match a family fontconfig knows about. `fc-list -f "%{family}\n" |
# sort -u` lists them. Bundled fonts are installed system wide by the installer.
Font="Plus Jakarta Sans"
FontSize="11"

# ---------------------------------------------------------------------------
# Background
# ---------------------------------------------------------------------------
# Path relative to the repo root. Stills only -- GDM cannot play video. To use
# a frame from a clip, point Background at the video and the build will pull a
# frame out of it (needs ffmpeg).
Background="backgrounds/cinder.jpg"

# Shown before the image loads and behind transparent edges.
BackgroundColor="#070304"

# Applied once at build time, so the greeter pays nothing at runtime.
# Blur 0.0 - 1.0, Dim 0.0 - 1.0.
Blur="0.0"
Dim="0.20"

# ---------------------------------------------------------------------------
# Clock
# ---------------------------------------------------------------------------
# GDM has no separate clock widget, so Thyx grows the top bar's date menu into
# the greeter's timestamp. ClockSize is in points.
ClockSize="20"
TimeTextColor="#ffd0bf"
DateTextColor="#e4b2a3"

# Written into GDM's own dconf profile by the installer.
# HourFormat: "24h" or "12h". The rest are true/false.
HourFormat="24h"
ShowDate="true"
ShowWeekday="true"
ShowSeconds="false"

# ---------------------------------------------------------------------------
# Shape and motion
# ---------------------------------------------------------------------------
# Radius is the pill radius for fields and buttons.
Radius="24"
RadiusSmall="10"
AnimationDuration="200"

# How much of the field colour shows through. 0.0 - 1.0.
FieldOpacity="0.25"
FormOpacity="0.00"

# ---------------------------------------------------------------------------
# Form
# ---------------------------------------------------------------------------
FormBackgroundColor="#070304"
LoginFieldBackgroundColor="#16090a"
LoginFieldTextColor="#fdc7b7"
PlaceholderTextColor="#b77e74"

# The focus ring. Upstream Thyx hard-coded a blue that fought every preset;
# here it is yours to set.
FocusRingColor="#f16f1c"
FocusRingWidth="2"

# ---------------------------------------------------------------------------
# Primary action
# ---------------------------------------------------------------------------
LoginButtonBackgroundColor="#f16f1c"
LoginButtonTextColor="#070304"
HoverLoginButtonBackgroundColor="#fdb039"

# ---------------------------------------------------------------------------
# Secondary controls
# ---------------------------------------------------------------------------
SystemButtonsIconsColor="#f3c4aa"
HoverSystemButtonsIconsColor="#fb8627"
EnvironmentButtonTextColor="#f3c4aa"
HoverEnvironmentButtonTextColor="#fb8627"

# ---------------------------------------------------------------------------
# Menus
# ---------------------------------------------------------------------------
DropdownTextColor="#fff0df"
DropdownSelectedTextColor="#070304"
DropdownBackgroundColor="#0b0505"
DropdownSelectedBackgroundColor="#f16f1c"
DropdownBorderColor="#5d2815"

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
# Caps Lock and "Sorry, that didn't work" use these.
WarningTextColor="#fdb039"

# ---------------------------------------------------------------------------
# Avatar
# ---------------------------------------------------------------------------
AvatarSize="128"
# 50 or more reads as a circle at this size; lower it for a squircle.
AvatarRadius="64"
AvatarBorderWidth="2"
AvatarBorderColor="#5d2815"

# ---------------------------------------------------------------------------
# Greeter behaviour
# ---------------------------------------------------------------------------
# false hides the Ubuntu/vendor logo above the form.
ShowLogo="false"

# true replaces the list of accounts with a username field. Worth turning on
# if you would rather not advertise who uses this machine.
DisableUserList="false"
