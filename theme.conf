[General]

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
# Font must match a family fontconfig knows about. `fc-list -f "%{family}\n" |
# sort -u` lists them. Bundled fonts are installed system wide by the installer.
Font="Plus Jakarta Sans"

# The base size, in points, that everything else is measured against. Plus
# Jakarta Sans has a tall x-height and sets wider than Cantarell or Ubuntu, so
# it reads a size larger than the number says; 10 here lands where 11 does in
# a stock greeter.
FontSize="10"

# The account name under the avatar. Defaults to FontSize * 1.3.
UserNameSize="13"

# Weights, 100 - 900. Plus Jakarta Sans is a variable face and reads heavy
# early, so these sit lower than the numbers alone suggest: 400 is the body,
# and anything above 600 turns the greeter into a poster. Yaru ends its sheet
# with `* { font-weight: normal !important }`, so these are all forced.
WeightUI="400"          # top bar, placeholders, messages
WeightEmphasis="500"    # account name, warnings, menu headings
ClockWeight="400"       # the clock in the top bar
FieldWeight="400"       # what you type into the password pill
ButtonWeight="600"      # the primary action, the one thing that shouts

# ---------------------------------------------------------------------------
# Background
# ---------------------------------------------------------------------------
# Path relative to the repo root. Stills only -- GDM cannot play video. To use
# a frame from a clip, point Background at the video and the build will pull a
# frame out of it (needs ffmpeg).
Background="backgrounds/cinder.jpg"

# Shown before the image loads and behind transparent edges.
BackgroundColor="#070304"

# Applied once at build time, so the greeter pays nothing at runtime.
# Blur 0.0 - 1.0, Dim 0.0 - 1.0.
Blur="0.0"
Dim="0.20"

# ---------------------------------------------------------------------------
# Clock
# ---------------------------------------------------------------------------
# GDM has no separate clock widget, so Thyx grows the top bar's date menu into
# the greeter's timestamp. ClockSize is in points.
ClockSize="16"
TimeTextColor="#ffd0bf"
DateTextColor="#e4b2a3"

# Written into GDM's own dconf profile by the installer.
# HourFormat: "24h" or "12h". The rest are true/false.
HourFormat="24h"
ShowDate="true"
ShowWeekday="true"
ShowSeconds="false"

# ---------------------------------------------------------------------------
# Shape and motion
# ---------------------------------------------------------------------------
# Radius is the pill radius for fields and buttons.
Radius="24"
RadiusSmall="10"
AnimationDuration="200"

# How much of the field colour shows through. 0.0 - 1.0.
FieldOpacity="0.25"
FormOpacity="0.00"

# ---------------------------------------------------------------------------
# Form
# ---------------------------------------------------------------------------
# Where the sign-in column sits. GDM centres it and gives no way to anchor it,
# so "left" and "right" work by padding the form out on one side: the wider
# box is still centred, which slides the visible part the other way by half
# the padding. FormOffset is that half, in pixels -- the distance from the
# middle of the screen, not from its edge, so one number holds up across
# monitor sizes. Upstream Thyx's FormPosition="left" is the same idea.
# center ignores FormOffset.
FormPosition="left"
FormOffset="480"

FormBackgroundColor="#070304"
LoginFieldBackgroundColor="#16090a"
LoginFieldTextColor="#fdc7b7"
PlaceholderTextColor="#b77e74"

# The focus ring. Upstream Thyx hard-coded a blue that fought every preset;
# here it is yours to set.
FocusRingColor="#f16f1c"
FocusRingWidth="2"

# ---------------------------------------------------------------------------
# Primary action
# ---------------------------------------------------------------------------
LoginButtonBackgroundColor="#f16f1c"
LoginButtonTextColor="#070304"
HoverLoginButtonBackgroundColor="#fdb039"

# ---------------------------------------------------------------------------
# Secondary controls
# ---------------------------------------------------------------------------
SystemButtonsIconsColor="#f3c4aa"
HoverSystemButtonsIconsColor="#fb8627"
EnvironmentButtonTextColor="#f3c4aa"
HoverEnvironmentButtonTextColor="#fb8627"

# The session picker and the login-options picker, bottom right. GDM labels
# neither -- both are a bare gear icon -- so they are easy to miss, and the
# session picker is the only way to choose Wayland vs Xorg at the login
# screen. Thyx draws them as outlined pills that take the accent on hover,
# and gives the menu that opens a visible "Session" heading.
MenuButtonSize="44"
MenuButtonIconSize="20"
MenuButtonBorderWidth="1"

# ---------------------------------------------------------------------------
# Menus
# ---------------------------------------------------------------------------
DropdownTextColor="#fff0df"
DropdownSelectedTextColor="#070304"
DropdownBackgroundColor="#0b0505"
DropdownSelectedBackgroundColor="#f16f1c"
DropdownBorderColor="#5d2815"

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
# Caps Lock and "Sorry, that didn't work" use these.
WarningTextColor="#fdb039"

# ---------------------------------------------------------------------------
# Avatar
# ---------------------------------------------------------------------------
AvatarSize="128"
# 50 or more reads as a circle at this size; lower it for a squircle.
AvatarRadius="64"
AvatarBorderWidth="2"
AvatarBorderColor="#5d2815"

# ---------------------------------------------------------------------------
# Wordmark
# ---------------------------------------------------------------------------
# The mark at the foot of the greeter. GDM's logo setting takes an image path
# and blits the file at its own pixel size, which is why the stock Ubuntu mark
# can never match a theme: its lettering is baked into the PNG. Thyx draws its
# own from LogoText, in the font and colour set above, so the bottom of the
# screen belongs to the theme like everything else.
ShowLogo="true"
LogoText="ubuntu"

# A file to use instead of drawing LogoText. Leave empty to draw the text.
LogoImage=""

# Cap height in pixels, and the weight and tracking of the lettering.
LogoSize="34"
LogoWeight="500"
LogoTracking="-1"

LogoColor="#f3c4aa"
LogoOpacity="0.75"

# How far the mark clears the bottom edge. Stock GDM pins the logo's own box
# to the very bottom of the screen, so without this it sits on the edge.
LogoBottomMargin="56"

# ---------------------------------------------------------------------------
# Greeter behaviour
# ---------------------------------------------------------------------------

# true replaces the list of accounts with a username field. Worth turning on
# if you would rather not advertise who uses this machine.
DisableUserList="false"
